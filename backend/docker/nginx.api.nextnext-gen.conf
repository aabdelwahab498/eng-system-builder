server {
    listen 80;
    server_name api.nextnext-gen.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.nextnext-gen.com;

    ssl_certificate /etc/letsencrypt/live/api.nextnext-gen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nextnext-gen.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Protect private payment proof directory from public static access
    location ~* ^/uploads/proofs/ {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
